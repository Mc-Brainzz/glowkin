[package]
name = "glowkin"
version = "0.1.0"
edition = "2021"
description = "A glowing desktop creature grown from how you use your AI."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
